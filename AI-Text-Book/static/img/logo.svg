<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot Head -->
  <circle cx="20" cy="15" r="8" fill="#22d3ee" opacity="0.2"/>
  <circle cx="20" cy="15" r="8" stroke="#22d3ee" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="17" cy="14" r="1.5" fill="#22d3ee"/>
  <circle cx="23" cy="14" r="1.5" fill="#22d3ee"/>

  <!-- Antenna -->
  <line x1="20" y1="7" x2="20" y2="4" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <circle cx="20" cy="4" r="1.5" fill="#fb923c"/>

  <!-- Body -->
  <rect x="16" y="24" width="8" height="10" rx="2" fill="#22d3ee" opacity="0.2"/>
  <rect x="16" y="24" width="8" height="10" rx="2" stroke="#22d3ee" stroke-width="2"/>

  <!-- Arms -->
  <line x1="16" y1="27" x2="12" y2="29" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="27" x2="28" y2="29" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>

  <!-- Legs -->
  <line x1="18" y1="34" x2="18" y2="37" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="34" x2="22" y2="37" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
</svg>
